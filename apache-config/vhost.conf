<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    Header always set X-Content-Type-Options "nosniff"

    # Página personalizada para errores 404
    ErrorDocument 404 /404.html

    # API PHP
    Alias /api /var/www/app/api

    <Directory /var/www/app/api>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Frontend React
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # No enviar las llamadas /api a React Router
        RewriteCond %{REQUEST_URI} !^/api/

        # Si el recurso existe físicamente, Apache lo sirve normalmente
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d

        # Solo estas rutas pertenecen a React Router
        RewriteCond %{REQUEST_URI} ^/(|menu|contact|restaurant|reservation|politica-cookies|aviso-legal)/?$
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>