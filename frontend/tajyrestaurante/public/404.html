<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Tajy Restaurante</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .error-container {
      max-width: 700px;
    }

    .error-code {
      font-size: clamp(7rem, 20vw, 14rem);
      line-height: 0.9;
      font-weight: 800;
      opacity: 0.15;
    }

    h1 {
      margin-top: -1rem;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      color: #ccc;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    a:hover {
      background: #fff;
      color: #111;
    }
  </style>
</head>

<body>
  <main class="error-container">
    <div class="error-code">404</div>

    <h1>Página no encontrada</h1>

    <p>
      Comprueba la dirección o vuelve al inicio de Tajy.
    </p>

    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
